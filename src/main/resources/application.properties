# ===================================================================
# SMART RESUME SCREENING SYSTEM - APPLICATION CONFIGURATION
# ===================================================================

server.port=${PORT:8080}
spring.application.name=Smart Resume Screening System

# -------------------------------------------------------------------
# Database Configuration (H2 File-based by default)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Switch to PostgreSQL (Uncomment to use PostgreSQL instead of H2)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/smart_resume_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=update

# -------------------------------------------------------------------
# File Upload Configuration (Max 10MB per file, 50MB per request)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# -------------------------------------------------------------------
# Screening Scoring Engine Weights & Thresholds
# Total weights = 100% (40% + 15% + 25% + 12% + 8%)
# -------------------------------------------------------------------
screening.weights.required-skills=40.0
screening.weights.preferred-skills=15.0
screening.weights.semantic-similarity=25.0
screening.weights.experience-fit=12.0
screening.weights.education-fit=8.0

# Status Classification Thresholds
screening.thresholds.shortlist-min-score=70.0
screening.thresholds.review-min-score=45.0

# -------------------------------------------------------------------
# Default Admin Seed Credentials
# -------------------------------------------------------------------
app.security.admin.username=admin
app.security.admin.password=admin123
app.security.admin.email=hr@company.com
app.security.admin.full-name=HR Administrator

# -------------------------------------------------------------------
# Swagger / OpenAPI Configuration
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.smartresume=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.tika=WARN
